<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스탯 카드 생성기</title>
  <!-- html2canvas 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d131f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* 전체 카드 컨테이너 (그리드 레이아웃) */
    #stat-card {
      width: 900px;
      background-color: #121927;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 20px;
      border: 1px solid #1e293b;
    }

    /* 좌측/우측 컬럼 구조 */
    .column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 섹션 기본 카드 스타일 */
    .card-box {
      background-color: #182232;
      border: 1px solid #232f42;
      border-radius: 12px;
      padding: 18px 20px;
    }

    /* 헤더 영역 */
    .header-box {
      padding: 4px 4px 12px 4px;
    }
    .location { font-size: 14px; color: #8e9bb0; font-weight: 500; }
    .datetime { font-size: 28px; font-weight: 800; margin: 4px 0 6px 0; color: #ffffff; letter-spacing: -0.5px; }
    .next-tag { font-size: 15px; font-weight: 700; color: #38bdf8; }
    .next-val { color: #d1d5db; font-weight: 600; }

    /* 체력 관리 카드 */
    .stamina-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .stamina-title { font-size: 16px; font-weight: 700; color: #ffffff; }
    .stamina-num { font-size: 18px; font-weight: 800; color: #22c55e; }
    .bar-bg {
      width: 100%;
      height: 14px;
      background-color: #0d131f;
      border-radius: 7px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .bar-fill {
      height: 100%;
      background-color: #22c55e;
      width: 0%;
      border-radius: 7px;
      transition: width 0.3s ease;
    }
    .stamina-footer {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #94a3b8;
    }

    /* 섹션 공통 타이틀 */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* 최근 활동 */
    .activity-text {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
    }

    /* 태그 스타일 (트레잇, 아이템 등) */
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      background-color: #263347;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
    }
    .tag.purple {
      background-color: #3b2d54;
      color: #c084fc;
    }

    /* 능력치(ABILITY) 영역 */
    .ability-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .position-badge {
      background-color: #332d1d;
      color: #eab308;
      border: 1px solid #713f12;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
    }
    .ability-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .ability-box {
      background-color: #0d131f;
      padding: 14px 8px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #1a2332;
    }
    .ability-label { font-size: 12px; color: #64748b; margin-bottom: 6px; }
    .ability-val { font-size: 20px; font-weight: 800; color: #ffffff; }

    .season-record {
      text-align: center;
      border-top: 1px solid #232f42;
      padding-top: 14px;
      font-size: 14px;
      color: #94a3b8;
    }
    .season-record span { color: #ffffff; font-weight: 700; }

    /* 자산 & 평판 영역 */
    .info-row {
      display: flex;
      gap: 24px;
      margin-bottom: 16px;
      font-size: 15px;
      color: #94a3b8;
    }
    .info-row span { color: #ffffff; font-weight: 700; }

    /* 다운로드 버튼 */
    .download-btn {
      margin-top: 28px;
      padding: 14px 28px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: background-color 0.2s;
    }
    .download-btn:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>

  <!-- 스탯 카드 영역 -->
  <div id="stat-card">
    
    <!-- 좌측 컬럼 -->
    <div class="column">
      <div class="header-box">
        <div class="location"><span id="loc">구장</span> | <span id="weather">날씨</span></div>
        <div class="datetime" id="datetime">2026.00.00 00:00</div>
        <div class="next-tag">NEXT: <span class="next-val" id="next">경기</span></div>
      </div>

      <div class="card-box">
        <div class="stamina-header">
          <span class="stamina-title">체력 관리</span>
          <span class="stamina-num"><span id="cur-hp">0</span>/<span id="max-hp">100</span></span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill" id="hp-bar"></div>
        </div>
        <div class="stamina-footer">
          <span id="hp-cond">상태</span>
          <span>효율등급: <span id="eff-grade">B</span></span>
        </div>
      </div>

      <div class="card-box">
        <div class="section-title">RECENT ACTIVITY</div>
        <div class="activity-text" id="recent-act">활동 내역 없음</div>
      </div>

      <div class="card-box">
        <div class="section-title">TRAITS</div>
        <div class="tag-container" id="traits-container">
          <!-- JS로 태그 삽입 -->
        </div>
      </div>
    </div>

    <!-- 우측 컬럼 -->
    <div class="column">
      <div class="card-box">
        <div class="ability-header">
          <div class="section-title" style="margin: 0;">ABILITY</div>
          <div class="position-badge" id="pos-badge">투수</div>
        </div>
        
        <div class="ability-grid">
          <div class="ability-box"><div class="ability-label">구속</div><div class="ability-val" id="stat-1">-</div></div>
          <div class="ability-box"><div class="ability-label">구위</div><div class="ability-val" id="stat-2">-</div></div>
          <div class="ability-box"><div class="ability-label">제구</div><div class="ability-val" id="stat-3">-</div></div>
          <div class="ability-box"><div class="ability-label">변화</div><div class="ability-val" id="stat-4">-</div></div>
        </div>

        <div class="season-record">
          시즌 기록: <span id="season-rec">0.00</span>
        </div>
      </div>

      <div class="card-box" style="flex: 1;">
        <div class="info-row">
          <div>자산: <span id="asset-val">0원</span></div>
          <div>평판: <span id="reputation-val">없음</span></div>
        </div>
        <div style="border-top: 1px solid #232f42; padding-top: 16px;">
          <div class="tag-container" id="equip-container">
            <!-- JS로 장비 태그 삽입 -->
          </div>
        </div>
      </div>
    </div>

  </div>

  <button class="download-btn" onclick="downloadImage()">이미지 저장하기</button>

  <script>
    function parseURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawData = urlParams.get('data');

      if (!rawData) return;

      const parts = rawData.split(',');

      // 1. 헤더 영역
      document.getElementById('loc').innerText = parts[0] || '구장 미정';
      document.getElementById('weather').innerText = parts[1] || '맑음';
      document.getElementById('datetime').innerText = parts[2] || '2026.00.00 00:00';
      document.getElementById('next').innerText = parts[3] || '없음';

      // 2. 최근 활동
      document.getElementById('recent-act').innerText = parts[4] || '없음';

      // 3. 체력 관리
      const curHp = parseInt(parts[5]) || 0;
      const maxHp = parseInt(parts[6]) || 100;
      document.getElementById('cur-hp').innerText = curHp;
      document.getElementById('max-hp').innerText = maxHp;
      document.getElementById('hp-bar').style.width = Math.min(100, Math.max(0, (curHp / maxHp) * 100)) + '%';
      document.getElementById('hp-cond').innerText = parts[7] || '보통';

      // 4. 효율 & 포지션 (예: "B-투")
      const effAndPos = (parts[8] || 'B-투').split('-');
      document.getElementById('eff-grade').innerText = effAndPos[0] || 'B';
      document.getElementById('pos-badge').innerText = effAndPos[1] === '투' ? '투수' : (effAndPos[1] || '선수');

      // 5. 능력치 (스탯)
      document.getElementById('stat-1').innerText = parts[9] || '-';
      document.getElementById('stat-2').innerText = parts[10] || '-';
      document.getElementById('stat-3').innerText = parts[11] || '-';
      document.getElementById('stat-4').innerText = parts[12] || '-';

      // 6. 특성(TRAITS), 시즌기록, 자산 분리 (예: "0.00-없음-3000만원")
      const traitAndAsset = (parts[13] || '0.00-없음-0원').split('-');
      document.getElementById('season-rec').innerText = traitAndAsset[0] || '0.00';
      
      // TRAITS 태그 생성
      const traitsContainer = document.getElementById('traits-container');
      traitsContainer.innerHTML = '';
      const traitText = traitAndAsset[1] || '없음';
      const traitTag = document.createElement('div');
      traitTag.className = 'tag purple';
      traitTag.innerText = traitText;
      traitsContainer.appendChild(traitTag);

      document.getElementById('asset-val').innerText = traitAndAsset[2] || '0원';

      // 7. 평판 & 아이템 분리 (예: "주목받는+신인-유니폼", "글러브")
      document.getElementById('reputation-val').innerText = parts[14] || '없음';

      // 장비(EQUIPMENT) 태그 생성
      const equipContainer = document.getElementById('equip-container');
      equipContainer.innerHTML = '';
      
      // parts[15] 이상에 존재하는 장비 항목들을 모두 태그로 변환
      for (let i = 15; i < parts.length; i++) {
        if (parts[i] && parts[i].trim() !== '') {
          const itemTag = document.createElement('div');
          itemTag.className = 'tag';
          itemTag.innerText = parts[i];
          equipContainer.appendChild(itemTag);
        }
      }
    }

    function downloadImage() {
      const cardNode = document.getElementById('stat-card');

      html2canvas(cardNode, {
        scale: 2,
        backgroundColor: null
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'stat-card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    window.onload = parseURL;
  </script>
</body>
</html>
