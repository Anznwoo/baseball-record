<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스탯 카드 생성기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d131f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    #stat-card {
      width: 950px;
      background-color: #121927;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 20px;
      border: 1px solid #1e293b;
    }

    .column { display: flex; flex-direction: column; gap: 16px; }
    .card-box { background-color: #182232; border: 1px solid #232f42; border-radius: 12px; padding: 18px 20px; }

    /* 헤더 */
    .location { font-size: 14px; color: #8e9bb0; font-weight: 500; }
    .datetime { font-size: 28px; font-weight: 800; margin: 4px 0 6px 0; color: #ffffff; }
    .next-tag { font-size: 15px; font-weight: 700; color: #38bdf8; }

    /* 체력 관리 */
    .stamina-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .stamina-title { font-size: 16px; font-weight: 700; }
    .stamina-num { font-size: 18px; font-weight: 800; color: #22c55e; }
    .bar-bg { width: 100%; height: 14px; background-color: #0d131f; border-radius: 7px; overflow: hidden; margin-bottom: 12px; }
    .bar-fill { height: 100%; background-color: #22c55e; width: 0%; border-radius: 7px; }
    .stamina-footer { display: flex; justify-content: space-between; font-size: 13px; color: #94a3b8; }

    .section-title { font-size: 13px; font-weight: 700; color: #64748b; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 12px; }
    .activity-text { font-size: 16px; font-weight: 600; color: #f1f5f9; }

    /* 태그 스타일 */
    .tag-container { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { background-color: #263347; color: #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
    .tag.purple { background-color: #3b2d54; color: #c084fc; }

    /* ABILITY 영역 */
    .ability-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .position-badge { background-color: #332d1d; color: #eab308; border: 1px solid #713f12; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; }
    
    /* 동적 스탯 그리드 레이아웃 */
    .ability-grid { display: grid; gap: 10px; margin-bottom: 20px; }
    .grid-5 { grid-template-columns: repeat(3, 1fr); }
    .grid-9 { grid-template-columns: repeat(3, 1fr); }

    .ability-box {
      background-color: #0d131f;
      padding: 10px 8px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #1a2332;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .ability-label { font-size: 11px; color: #64748b; margin-bottom: 6px; }

    /* ----------------------------------------------------
       등급 뱃지 별 색상 스타일 (요청하신 색상 반영)
    ---------------------------------------------------- */
    .grade-badge {
      display: inline-block;
      width: 42px;
      height: 28px;
      line-height: 28px;
      border-radius: 4px;
      font-size: 18px;
      font-weight: 900;
      text-align: center;
    }

    /* G: 검은 배경 / 노란 글씨 */
    .grade-G { background-color: #000000; color: #ffeb3b; border: 1px solid #333; }
    /* Z: 보라색 배경 / 흰 글씨 */
    .grade-Z { background-color: #6a1b9a; color: #ffffff; }
    /* S: 주황/금색 배경 / 흰 글씨 (예시 이미지 상의 S등급 스타일) */
    .grade-S { background-color: #c0ca33; color: #ffffff; }
    /* A: 초록색 배경 / 흰 글씨 */
    .grade-A { background-color: #2e7d32; color: #ffffff; }
    /* B: 연한 파란색 배경 / 흰 글씨 */
    .grade-B { background-color: #0288d1; color: #ffffff; }
    /* C: 진한 파란색 배경 / 흰 글씨 */
    .grade-C { background-color: #1565c0; color: #ffffff; }
    /* D: 노란색(주황빛) 배경 / 흰 글씨 */
    .grade-D { background-color: #f57f17; color: #ffffff; }
    /* E: 검은색 배경 / 흰 글씨 */
    .grade-E { background-color: #212121; color: #ffffff; border: 1px solid #424242; }
    /* F: 빨간색 배경 / 흰 글씨 */
    .grade-F { background-color: #d32f2f; color: #ffffff; }

    .season-record { text-align: center; border-top: 1px solid #232f42; padding-top: 14px; font-size: 14px; color: #94a3b8; }
    .season-record span { color: #ffffff; font-weight: 700; }

    .info-row { display: flex; gap: 24px; margin-bottom: 16px; font-size: 15px; color: #94a3b8; }
    .info-row span { color: #ffffff; font-weight: 700; }

    .download-btn {
      margin-top: 28px; padding: 14px 28px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
  </style>
</head>
<body>

  <div id="stat-card">
    <!-- 좌측 컬럼 -->
    <div class="column">
      <div style="padding: 4px 4px 12px 4px;">
        <div class="location"><span id="loc">구장</span> | <span id="weather">날씨</span></div>
        <div class="datetime" id="datetime">2026.00.00 00:00</div>
        <div class="next-tag">NEXT: <span style="color:#d1d5db;" id="next">경기</span></div>
      </div>

      <div class="card-box">
        <div class="stamina-header">
          <span class="stamina-title">체력 관리</span>
          <span class="stamina-num"><span id="cur-hp">0</span>/<span id="max-hp">100</span></span>
        </div>
        <div class="bar-bg"><div class="bar-fill" id="hp-bar"></div></div>
        <div class="stamina-footer">
          <span id="hp-cond">상태</span>
          <span>효율등급: <span id="eff-grade">B</span></span>
        </div>
      </div>

      <div class="card-box">
        <div class="section-title">RECENT ACTIVITY</div>
        <div class="activity-text" id="recent-act">활동 내역 없음</div>
      </div>

      <div class="card-box">
        <div class="section-title">TRAITS</div>
        <div class="tag-container" id="traits-container"></div>
      </div>
    </div>

    <!-- 우측 컬럼 -->
    <div class="column">
      <div class="card-box">
        <div class="ability-header">
          <div class="section-title" style="margin: 0;">ABILITY</div>
          <div class="position-badge" id="pos-badge">선수</div>
        </div>
        
        <div class="ability-grid" id="ability-grid"></div>

        <div class="season-record">
          시즌 기록: <span id="season-rec">0.00</span>
        </div>
      </div>

      <div class="card-box" style="flex: 1;">
        <div class="info-row">
          <div>자산: <span id="asset-val">0원</span></div>
          <div>평판: <span id="reputation-val">없음</span></div>
        </div>
        <div style="border-top: 1px solid #232f42; padding-top: 16px;">
          <div class="tag-container" id="equip-container"></div>
        </div>
      </div>
    </div>
  </div>

  <button class="download-btn" onclick="downloadImage()">이미지 저장하기</button>

  <script>
    // 숫자 수치를 받아 알파벳 등급으로 변환
    function getGradeLetter(score) {
      if (!score) return '-';
      const num = parseInt(score);
      
      if (isNaN(num)) {
        // 이미 '[A]' 처럼 들어온 경우 대문자 알파벳만 추출
        return score.replace(/\[|\]/g, '').toUpperCase();
      }

      if (num >= 19) return 'G';
      if (num >= 17) return 'Z';
      if (num >= 15) return 'S';
      if (num >= 13) return 'A';
      if (num >= 11) return 'B';
      if (num >= 9)  return 'C';
      if (num >= 7)  return 'D';
      if (num >= 5)  return 'E';
      return 'F';
    }

    // 등급 문자 기반 HTML 뱃지 요소 생성
    function createGradeBadgeHTML(score) {
      const letter = getGradeLetter(score);
      if (letter === '-') return '-';
      return `<span class="grade-badge grade-${letter}">${letter}</span>`;
    }

    function parseURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawData = urlParams.get('data');
      if (!rawData) return;

      const parts = rawData.split(',');

      // 1. 기본 헤더 정보
      document.getElementById('loc').innerText = parts[0] || '구장 미정';
      document.getElementById('weather').innerText = parts[1] || '맑음';
      document.getElementById('datetime').innerText = parts[2] || '2026.00.00 00:00';
      document.getElementById('next').innerText = parts[3] || '없음';
      document.getElementById('recent-act').innerText = parts[4] || '없음';

      // 2. 체력 관리
      const curHp = parseInt(parts[5]) || 0;
      const maxHp = parseInt(parts[6]) || 100;
      document.getElementById('cur-hp').innerText = curHp;
      document.getElementById('max-hp').innerText = maxHp;
      document.getElementById('hp-bar').style.width = Math.min(100, Math.max(0, (curHp / maxHp) * 100)) + '%';
      document.getElementById('hp-cond').innerText = parts[7] || '보통';

      // 3. 효율등급 및 포지션
      const effAndPos = (parts[8] || 'B-투').split('-');
      document.getElementById('eff-grade').innerText = effAndPos[0] || 'B';
      const isPitcher = effAndPos[1] !== '타';
      document.getElementById('pos-badge').innerText = isPitcher ? '투수' : '타자';

      // 4. 능력치(ABILITY) 동적 그리드 생성
      const gridContainer = document.getElementById('ability-grid');
      gridContainer.innerHTML = '';

      let statCount = 0;

      if (isPitcher) {
        // 투수 5대 스탯
        statCount = 5;
        gridContainer.className = 'ability-grid grid-5';
        const pitcherStats = [
          { label: '구삼진(K)', val: createGradeBadgeHTML(parts[9]) },
          { label: '제구(BB)', val: createGradeBadgeHTML(parts[10]) },
          { label: '피장타억제(HR)', val: createGradeBadgeHTML(parts[11]) },
          { label: '투구수관리(EFF)', val: createGradeBadgeHTML(parts[12]) },
          { label: '스태미나(STA)', val: createGradeBadgeHTML(parts[13]) }
        ];
        pitcherStats.forEach(s => gridContainer.appendChild(createStatBox(s.label, s.val)));
      } else {
        // 타자 9대 스탯
        statCount = 9;
        gridContainer.className = 'ability-grid grid-9';
        const batterStats = [
          { label: '컨택(CON)', val: createGradeBadgeHTML(parts[9]) },
          { label: '홈런(HOM)', val: createGradeBadgeHTML(parts[10]) },
          { label: '갭파워(GAP)', val: createGradeBadgeHTML(parts[11]) },
          { label: '선구(BALL)', val: createGradeBadgeHTML(parts[12]) },
          { label: '삼진회피(K)', val: createGradeBadgeHTML(parts[13]) },
          { label: '주루(RUN)', val: createGradeBadgeHTML(parts[14]) },
          { label: '도루(STL)', val: createGradeBadgeHTML(parts[15]) },
          { label: '호수비(NDEF)', val: createGradeBadgeHTML(parts[16]) },
          { label: '수비안정(EDEF)', val: createGradeBadgeHTML(parts[17]) }
        ];
        batterStats.forEach(s => gridContainer.appendChild(createStatBox(s.label, s.val)));
      }

      // 5. 스탯 개수에 맞춘 인덱스 계산
      const baseIndex = 9 + statCount;

      const traitAndAsset = (parts[baseIndex] || '0.00-없음-0원').split('-');
      document.getElementById('season-rec').innerText = traitAndAsset[0] || '0.00';
      
      const traitsContainer = document.getElementById('traits-container');
      traitsContainer.innerHTML = '';
      const traitTag = document.createElement('div');
      traitTag.className = 'tag purple';
      traitTag.innerText = traitAndAsset[1] || '없음';
      traitsContainer.appendChild(traitTag);

      document.getElementById('asset-val').innerText = traitAndAsset[2] || '0원';
      document.getElementById('reputation-val').innerText = parts[baseIndex + 1] || '없음';

      // 장비 태그
      const equipContainer = document.getElementById('equip-container');
      equipContainer.innerHTML = '';
      for (let i = baseIndex + 2; i < parts.length; i++) {
        if (parts[i] && parts[i].trim() !== '') {
          const itemTag = document.createElement('div');
          itemTag.className = 'tag';
          itemTag.innerText = parts[i];
          equipContainer.appendChild(itemTag);
        }
      }
    }

    function createStatBox(label, valueHtml) {
      const box = document.createElement('div');
      box.className = 'ability-box';
      box.innerHTML = `<div class="ability-label">${label}</div><div>${valueHtml}</div>`;
      return box;
    }

    function downloadImage() {
      html2canvas(document.getElementById('stat-card'), { scale: 2, backgroundColor: null }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'stat-card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    window.onload = parseURL;
  </script>
</body>
</html>
