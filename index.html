<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스탯 카드 생성기</title>
  <!-- HTML을 이미지로 바꿔주는 html2canvas 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Pretendard', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      margin: 0;
    }

    /* 캡처 대상 영역 */
    #stat-card {
      width: 600px;
      background-color: #1e293b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    .header {
      margin-bottom: 20px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }

    .location { font-size: 14px; color: #94a3b8; }
    .datetime { font-size: 24px; font-weight: bold; margin: 4px 0; }
    .next { color: #38bdf8; font-weight: 600; }

    .stamina-section {
      background-color: #0f172a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .stamina-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .bar-bg {
      width: 100%;
      height: 12px;
      background-color: #334155;
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background-color: #22c55e;
      width: 0%; /* JS로 제어 */
      transition: width 0.3s ease;
    }

    .ability-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .ability-box {
      background-color: #0f172a;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .ability-title { font-size: 12px; color: #94a3b8; }
    .ability-val { font-size: 18px; font-weight: bold; margin-top: 4px; }

    /* 버튼 스타일 */
    .download-btn {
      margin-top: 24px;
      padding: 12px 24px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .download-btn:hover { background-color: #2563eb; }
  </style>
</head>
<body>

  <!-- 스탯 카드 영역 (이 부분이 이미지로 변환됨) -->
  <div id="stat-card">
    <div class="header">
      <div class="location"><span id="loc">구장</span> | <span id="weather">날씨</span></div>
      <div class="datetime" id="datetime">2026.00.00 00:00</div>
      <div class="next">NEXT: <span id="next">경기</span></div>
    </div>

    <div class="stamina-section">
      <div class="stamina-header">
        <span>체력 관리</span>
        <span><strong id="current-stamina">0</strong> / <span id="max-stamina">100</span></span>
      </div>
      <div class="bar-bg">
        <div class="bar-fill" id="stamina-bar"></div>
      </div>
    </div>

    <div class="ability-grid">
      <div class="ability-box"><div class="ability-title">구속</div><div class="ability-val" id="stat-1">-</div></div>
      <div class="ability-box"><div class="ability-title">구위</div><div class="ability-val" id="stat-2">-</div></div>
      <div class="ability-box"><div class="ability-title">제구</div><div class="ability-val" id="stat-3">-</div></div>
      <div class="ability-box"><div class="ability-title">변화</div><div class="ability-val" id="stat-4">-</div></div>
    </div>
  </div>

  <button class="download-btn" onclick="downloadImage()">이미지 저장하기</button>

  <script>
    // 1. URL의 쿼리스트링(?data=...) 파싱하기
    function parseURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawData = urlParams.get('data');

      if (!rawData) return;

      // 쉼표로 데이터 분리
      const parts = rawData.split(',');

      // DOM 요소에 데이터 바인딩
      document.getElementById('loc').innerText = parts[0] || '구장 미정';
      document.getElementById('weather').innerText = parts[1] || '맑음';
      document.getElementById('datetime').innerText = parts[2] || '2026.01.01 00:00';
      document.getElementById('next').innerText = parts[3] || '없음';

      const currentHp = parseInt(parts[5]) || 0;
      const maxHp = parseInt(parts[6]) || 100;
      document.getElementById('current-stamina').innerText = currentHp;
      document.getElementById('max-stamina').innerText = maxHp;
      
      // 게이지 바 퍼센트 계산
      const hpPercent = Math.min(100, Math.max(0, (currentHp / maxHp) * 100));
      document.getElementById('stamina-bar').style.width = hpPercent + '%';

      // 스탯 레벨
      document.getElementById('stat-1').innerText = parts[10] || '-';
      document.getElementById('stat-2').innerText = parts[11] || '-';
      document.getElementById('stat-3').innerText = parts[12] || '-';
      document.getElementById('stat-4').innerText = parts[13] || '-';
    }

    // 2. 화면을 이미지(PNG)로 변환해 다운로드
    function downloadImage() {
      const cardNode = document.getElementById('stat-card');

      html2canvas(cardNode, {
        scale: 2, // 화질을 2배로 향상
        backgroundColor: null // 배경 투명 처리 지원
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'stat-card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    // 페이지 로드시 파싱 실행
    window.onload = parseURL;
  </script>
</body>
</html>
